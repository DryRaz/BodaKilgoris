<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#168045">
  <title>Boda Kilgoris</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f3f6f4;color:#17201b;text-align:center;padding:24px}
    h1{font-size:1.5rem;margin:.5rem 0}
    p{color:#55645b;margin:.25rem 0}
    button{margin-top:20px;min-height:52px;padding:0 28px;border:0;border-radius:16px;background:#168045;color:#fff;font-size:1.1rem;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div style="font-size:64px" aria-hidden="true">📡</div>
    <h1>No connection · Hakuna mtandao</h1>
    <p>Check your network, then try again.</p>
    <p>Angalia mtandao wako, kisha jaribu tena.</p>
    <button onclick="location.reload()">Retry · Jaribu tena</button>
  </main>
</body>
</html>
